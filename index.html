<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparateur Météo - Spots d'Escalade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧗 Comparateur Météo - Spots d'Escalade</h1>
        <div class="api-info">
            Données : ARPEGE + AROME (J+1 à J+4) • Modèles globaux (J+5 à J+10) • Prévisions jusqu'à 10 jours
        </div>
        
        <div class="controls">
            <div class="date-selector">
                <input type="date" id="dateInput">
            </div>
            <div class="date-navigation">
                <button id="dateNavBackButton" onclick="moveDateBackward()">◀</button>
                <button id="dateNavForwardButton" onclick="moveDateForward()">▶</button>
            </div>
            <div class="add-location-section">
                <div class="add-location-form">
                    <input type="text" id="spotName" placeholder="Nom du spot">
                    <input type="text" id="spotLat" placeholder="Latitude (ex: 45.8992)">
                    <input type="text" id="spotLon" placeholder="Longitude (ex: 6.1294)">
                    <button onclick="addLocation()">Ajouter</button>
                </div>
            </div>
        </div>
        <div class="context-menu" id="contextMenu">
            <div class="menu-item" id="copyCoordinates">📋 Copy Lat, Long coordinates</div>
            <a id="meteo-blue-link" target="_blank" rel="noopener noreferrer" href="https://www.meteoblue.com/fr/meteo/semaine/0.0N0.0E?day=1">
                <div class="menu-item" id="linkToMeteoBlue">⛅ Go to Meteoblue</div>
            </a>
        </div>
        <div class="trend-banner" id="trendBanner"></div>
        <div class="weather-grid" id="weatherGrid"></div>
        
        <div class="legend" style="margin-top: 10px;">
            <div class="legend-item">
                <div class="legend-box" style="background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);"></div>
                <span>Bonnes conditions</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);"></div>
                <span>Conditions moyennes</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);"></div>
                <span>Mauvaises conditions</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
